# Her push ve pull request'te analiz ve testleri koşturur.
#
# Neden: 219 test var ama yalnız biri onları çalıştırmayı hatırladığında
# koruyorlar. Yayına çıkmadan önce koşturmayı bir kez unutmak, testlerin
# tamamını o an için yok saymak demek. Burada unutulamaz.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı dal için arka arkaya push yapıldığında eskisini iptal et: sıradaki
# koşum zaten daha yeni kodu sınayacak.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — analiz ve testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      # `analyze` ayrı bir adım: bir lint hatası test çıktısının içinde
      # kaybolmasın, kendi satırında dursun.
      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      # Derlemenin gerçekten çıktığını da doğrula: analiz temiz olduğu hâlde
      # web derlemesi bir eklenti yüzünden patlayabiliyor.
      - name: flutter build web
        run: flutter build web --release

      - name: Verify Functions web plugin
        run: python3 tool/verify_web_bundle.py

  turnstile:
    name: Turnike — sunucu ve erişim kuralları
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
      - run: npm install --global firebase-tools@15.15.0
      - name: Kart erişim sınırları
        run: firebase emulators:exec --project demo-yurt-turnstile --config firebase.turnstile.emulator.json --only database "node functions/test/rules.cjs"
      - name: Cihaz bağlama ve röle uçtan uca akışı
        run: firebase emulators:exec --project demo-yurt-turnstile --config firebase.turnstile.emulator.json --only auth,firestore,database,functions "node functions/test/integration.cjs"
      - name: Hareket kayıtlarının Firestore kuralları
        run: firebase emulators:exec --project demo-yurt-test --config firebase.emulator.json --only auth,firestore "node tool/verify_dorm_rules.cjs"
